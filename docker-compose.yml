services:
  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/code
      - static_volume:/code/static
    ports:
      - "8000:8000"
    depends_on:
      - my-postgres
      - redis

    env_file:
      - ./.env

  my-postgres:
    image: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./.env
    ports:
      - "5432:5432"

  redis:
    image: redis
    restart: on-failure

  celery:
    build: .
    command: >
      bash -c "celery -A config worker -l INFO --concurrency=500 --pool=eventlet"

    env_file:
      - .env
    volumes:
      - .:/code
    depends_on:
      - redis
      - my-postgres


  celery_beat:
    build: .
    env_file:
      - .env
    volumes:
      - .:/code
    command: >
      bash -c "poetry run celery -A config beat --loglevel=info"
    depends_on:
      - redis
      - my-postgres

volumes:
  postgres_data:
  static_volume: